name: Copy Pages 6-8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout global site
        uses: actions/checkout@v4

      - name: Clone India site
        run: git clone --depth 1 https://github.com/thegkexpert662-afk/kopersay-wms1.git /tmp/kopersay-in

      - name: Copy pages 6-8
        run: |
          cp /tmp/kopersay-in/products.html ./products.html
          cp /tmp/kopersay-in/apps.html ./apps.html
          cp /tmp/kopersay-in/about.html ./about.html
          sed -i 's#https://kopersay\.in#https://kopersay.com#g' products.html apps.html about.html

      - name: Commit copied pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.html apps.html about.html
          git diff --cached --quiet || git commit -m "Copy pages 6-8 to global site [skip ci]"
          git push
