name: Restore Founder Section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match founder section with India site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          founder_css = '''
.founder-section{max-width:1100px;margin:8px auto 30px;padding:0 18px}.founder-slider{position:relative;overflow:hidden;border-radius:28px}.founder-slides{display:flex;transition:transform .55s ease}.founder-slide{min-width:100%}.founder-card{display:grid;grid-template-columns:220px minmax(0,1fr);gap:30px;align-items:center;padding:30px;border-radius:28px}.founder-photo{width:100%;aspect-ratio:2/3;display:block;object-fit:cover;object-position:center top;border:6px solid rgba(255,255,255,.9);border-radius:23px;box-shadow:0 17px 38px rgba(40,80,130,.22)}.founder-content h2{margin:12px 0 3px;font-size:31px}.founder-role{margin-bottom:13px;color:#6545ed;font-size:13px;font-weight:800}.founder-content>p:not(.founder-role){max-width:620px;color:#5f7088;font-size:13px}.founder-quote{margin-top:16px;padding:12px 0 12px 13px;border-left:4px solid #6847ed;color:#3e526c;font-size:13px;font-style:italic;font-weight:600;background:rgba(255,255,255,.2);border-radius:0 14px 14px 0}.founder-slide-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;font-size:23px;z-index:5}.founder-prev{left:10px}.founder-next{right:10px}.founder-dots{bottom:12px;z-index:6}
@media(max-width:700px){.founder-card{grid-template-columns:1fr;text-align:center;padding:24px}.founder-photo{max-width:280px;margin:auto}.founder-content>p:not(.founder-role){margin:auto}.founder-role{margin-bottom:10px}}
'''

          if '.founder-photo{' not in s:
              marker = '</style>'
              s = s.replace(marker, founder_css + marker, 1)

          founder = '''
<section class="founder-section" aria-label="Kopersay leadership"><div class="founder-slider"><div class="founder-slides"><div class="founder-slide"><div class="founder-card"><img class="founder-photo" src="assets/founder-ceo-portrait.png" alt="Founder and CEO of Kopersay Technologies"><div class="founder-content"><span class="founder-label">MEET THE FOUNDER</span><h2>Mohan Kumar Mrityunjay</h2><p class="founder-role">Founder &amp; CEO, Kopersay Technologies</p><p>Focused on building practical digital solutions that create real value for businesses and users.</p><div class="founder-quote">Building useful technology with a global vision.</div></div></div></div></div></div></section>
'''

          pattern = re.compile(r'<section[^>]*id="founder"[^>]*>.*?</section>', re.S)
          if pattern.search(s):
              s = pattern.sub(founder.strip(), s, count=1)
          else:
              marker = '<section class="contact-box" id="contact">'
              s = s.replace(marker, founder + marker, 1) if marker in s else s.replace('</body>', founder + '</body>', 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Match founder section with India site"
          git push
