name: Sync Founder From India Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-founder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact founder HTML and styling from kopersay.in source
        run: |
          python3 - <<'PY'
          import re, urllib.request
          from pathlib import Path

          target = Path('index.html')
          s = target.read_text()
          src_url = 'https://raw.githubusercontent.com/thegkexpert662-afk/kopersay-wms1/959e7b44156fc680402f457130cae141680f51f0/index.html'
          src = urllib.request.urlopen(src_url, timeout=30).read().decode('utf-8')

          # Use the exact Founder section markup from the India site's source.
          m = re.search(r'<section class="founder-section" id="founder"[\\s\\S]*?</section>', src)
          if not m:
              raise SystemExit('Could not find founder section in India source')
          founder_html = m.group(0)

          # Replace the existing founder section, regardless of its previous markup.
          start = s.find('<section class="founder-section" id="founder">')
          if start == -1:
              start = s.find('<section class="section" id="founder">')
          end = s.find('<section class="contact-box" id="contact">', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate founder/contact boundary in target')
          s = s[:start] + founder_html + '\n' + s[end:]

          # Add the exact Founder CSS rules from the India source if missing.
          css_rules = []
          for selector in ['.founder-section', '.founder-slider', '.founder-slides', '.founder-slide', '.founder-card', '.founder-photo', '.founder-content h2', '.founder-role', '.founder-content>p:not(.founder-role)', '.founder-quote', '.founder-slide-btn', '.founder-prev', '.founder-next', '.founder-dots']:
              mm = re.search(re.escape(selector) + r'\{[^}]*\}', src)
              if mm:
                  css_rules.append(mm.group(0))
          # Preserve the responsive Founder styling too.
          mm = re.search(r'@media\\(max-width:800px\\)\\{[^}]*\\.founder-card[^}]*\\}[^}]*\\}', src)
          if mm:
              css_rules.append(mm.group(0))
          css = '\n' + ''.join(css_rules) + '\n'
          if '.founder-section{' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          target.write_text(s)
          PY
      - name: Commit synced Founder section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Sync Founder section from India site"
          git push
