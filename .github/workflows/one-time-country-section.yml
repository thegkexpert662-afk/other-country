name: Add Global Country Section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add six country cards before founder
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'class="countries-section"' in s:
              raise SystemExit("Country section already exists; no change needed.")
          marker = '<section class="founder-section">'
          section = '''<section class="countries-section" aria-label="Global Markets">
<div class="section-title countries-title"><span class="badge">GLOBAL MARKETS</span><h2>Countries We Serve</h2><p>Technology solutions for businesses across key international markets and beyond.</p></div>
<div class="countries-grid">
<div class="country-card">🇺🇸 United States (USA)</div>
<div class="country-card">🇬🇧 United Kingdom (UK)</div>
<div class="country-card">🇦🇪 United Arab Emirates (UAE)</div>
<div class="country-card">🇨🇦 Canada</div>
<div class="country-card">🇦🇺 Australia</div>
<div class="country-card other-country-card">🌍 Other Countries</div>
</div>
</section>
'''
          if marker not in s:
              raise SystemExit("Founder section marker not found")
          s = s.replace(marker, section + marker, 1)
          css = '''\n.countries-section{max-width:1100px;margin:8px auto 30px;padding:0 18px}.countries-title{text-align:center;margin-bottom:25px}.countries-title h2{font-size:29px;margin-top:10px}.countries-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.country-card{min-height:88px;padding:24px 16px;border-radius:23px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:800;color:#30415b}.other-country-card{color:#6545ed}@media(max-width:800px){.countries-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.countries-section{padding:0 12px}.countries-grid{grid-template-columns:1fr}.country-card{min-height:76px}}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit index change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add six global country cards above founder" || true
          git push
          git rm .github/workflows/one-time-country-section.yml
          git commit -m "Remove temporary country update workflow"
          git push
