name: Website Security Audit

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions scheduled workflows have a minimum practical interval of 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site security
        shell: bash
        run: |
          set -euo pipefail
          base="https://kopersay.com"
          pages=(
            "/"
            "/about.html"
            "/products.html"
            "/services.html"
            "/contact.html"
            "/software.html"
            "/business-software.html"
            "/wms.html"
          )

          echo "Checking HTTPS and security headers..."
          for page in "${pages[@]}"; do
            url="$base$page"
            headers="$(curl -fsSIL --max-time 20 "$url")"
            echo "--- $url"
            echo "$headers" | grep -qi '^HTTP/.* 200' || {
              echo "FAIL: $url did not return HTTP 200"; exit 1;
            }
            echo "$headers" | grep -qi '^strict-transport-security:' || \
              echo "WARN: HSTS header missing on $url"
            echo "$headers" | grep -qi '^x-content-type-options:' || \
              echo "WARN: X-Content-Type-Options missing on $url"
            echo "$headers" | grep -qi '^x-frame-options:' || \
              echo "WARN: X-Frame-Options missing on $url"
          done

          echo "Checking sitemap and robots.txt..."
          curl -fsS --max-time 20 "$base/sitemap.xml" >/dev/null
          curl -fsS --max-time 20 "$base/robots.txt" >/dev/null

          echo "Checking HTML for obvious leaked credentials..."
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for page in "${pages[@]}"; do
            curl -fsS --max-time 20 "$base$page" >> "$tmp"
            printf '\n' >> "$tmp"
          done
          if grep -Eiq '(api[_-]?key|secret[_-]?key|password\s*[:=]|authorization:\s*bearer)' "$tmp"; then
            echo "FAIL: Possible credential-like string found in public HTML. Review immediately."
            exit 1
          fi

          echo "Security audit completed successfully."
